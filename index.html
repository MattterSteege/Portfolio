        <!-- BACKSTORY -->
        <div class="object" id="backstory" style="top: 35vh;left: 45vw;z-index: 9;">
            <svg xmlns="http://www.w3.org/2000/svg" width="120" height="150" viewBox="24 12 80 100" stroke="#3a2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
                <style>
                    #flame-outer {
                        transform-origin: 64px 88px;
                        animation: sway-outer 2.6s ease-in-out infinite;
                    }
                    @keyframes sway-outer {
                        0%   { transform: scale(1, 1) rotate(0deg); }
                        25%  { transform: scale(1.03, 0.97) rotate(1.5deg); }
                        50%  { transform: scale(0.97, 1.04) rotate(-1deg); }
                        75%  { transform: scale(1.02, 0.98) rotate(1deg); }
                        100% { transform: scale(1, 1) rotate(0deg); }
                    }

                    /* inner flame: faster flicker, opposite phase, anchored a bit higher */
                    #flame-inner {
                        transform-origin: 64px 82px;
                        animation: sway-inner 1.9s ease-in-out infinite;
                    }
                    @keyframes sway-inner {
                        0%   { transform: scale(1, 1) rotate(0deg); opacity: 1; }
                        30%  { transform: scale(0.95, 1.06) rotate(-2deg); opacity: 0.94; }
                        60%  { transform: scale(1.05, 0.94) rotate(2deg); opacity: 1; }
                        100% { transform: scale(1, 1) rotate(0deg); opacity: 1; }
                    }

                    /* sparks drifting up and fading */
                    .spark {
                        animation: rise 2.8s ease-in infinite;
                        transform-origin: center;
                    }
                    .spark.s2 { animation-delay: 0.7s; }
                    @keyframes rise {
                        0%   { transform: translate(0, 0) scale(1); opacity: 0.9; }
                        70%  { opacity: 0.7; }
                        100% { transform: translate(4px, -34px) scale(0.3); opacity: 0; }
                    }

                    /* logs stay put, just a very subtle warm glow pulse */
                    #logs {
                        animation: glow 1.6s ease-in-out infinite;
                    }
                    @keyframes glow {
                        0%, 100% { filter: brightness(1); }
                        50%      { filter: brightness(1.05); }
                    }
                </style>
                <filter id="blend-overlay-campfire" x="0" y="0" width="110" height="118" filterUnits="userSpaceOnUse">
                    <feImage href="paper_texture.jpg" x="0" y="0" width="104" height="118" preserveAspectRatio="none" result="texture"></feImage>
                    <feBlend mode="multiply" in="SourceGraphic" in2="texture" result="blended_result"></feBlend>
                    <feComposite operator="in" in="blended_result" in2="SourceGraphic"></feComposite>
                </filter>
                <g id="campfire" filter="url(#blend-overlay-campfire)">
                    <g id="flame-outer">
                        <path d="M64 14 C74 38 96 48 92 74 C90 96 38 96 36 74 C34 56 52 50 56 34 C58 26 60 22 64 14 Z" fill="#f7862d"></path>
                    </g>
                    <g id="flame-inner">

                    </g>
                    <g id="logs">

                        <rect x="24" y="88" width="80" height="12" rx="6" transform="rotate(18 64 94)" fill="#a9784a"></rect>

                    <circle class="spark s2" cx="30" cy="40" r="2" fill="#f7862d" stroke="none"></circle>
                </g>

            <svg xmlns="http://www.w3.org/2000/svg" width="159" height="147" viewBox="0 0 106 98" stroke="#3a2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
                <style>
                    .fruit {
                        transform-box: fill-box;
                        transform-origin: center;
                        animation: pulse 2.4s ease-in-out infinite;
                    }
                    .plant.delay-1 .fruit { animation-delay: -0.4s; }
                    .plant.delay-2 .fruit { animation-delay: -1.1s; }
                    .plant.delay-3 .fruit { animation-delay: -1.7s; }

                    @keyframes pulse {
                        0%, 100% { transform: scale(1); }
                        50%      { transform: scale(1.08); }
                    }

                    .leaf-left {
                        transform-box: fill-box;
                        transform-origin: bottom right;
                        animation: flutter-left 3.6s ease-in-out infinite;
                    }
                    .leaf-right {
                        transform-box: fill-box;
                        transform-origin: bottom left;
                        animation: flutter-right 3.6s ease-in-out infinite;
                    }

                    @keyframes flutter-left {
                        0%, 100% { rotate: 0deg; }
                        50%      { rotate: -6deg; }
                    }
                    @keyframes flutter-right {
                        0%, 100% { rotate: 0deg; }
                        50%      { rotate: 6deg; }
                    }
                </style>

                        <circle class="fruit" cx="0" cy="8" r="10" fill="#e8453c" stroke-width="2.5"/>
                    </g>

                        <path class="leaf-right" d="M0 0 C14 -4 22 -14 14 -22 C4 -20 0 -10 0 0 Z" fill="#4fbf5a" stroke-width="2.5"/>
                        <circle class="fruit" cx="0" cy="8" r="10" fill="#e8453c" stroke-width="2.5"/>
                    </g>

                        <path class="leaf-right" d="M0 0 C14 -4 22 -14 14 -22 C4 -20 0 -10 0 0 Z" fill="#4fbf5a" stroke-width="2.5"/>

                    </g>
