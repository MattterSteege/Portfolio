<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
<div class="overlay"></div>
<div id="grid">
    <div class="grid-item" style="background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); --grid-x: 1; --grid-y:1;"></div>
    <div class="grid-item" style="background: linear-gradient(45deg, #a18cd1 0%, #fbc2eb 100%); --grid-x: 1; --grid-y:-1;"></div>
    <div class="grid-item" style="background: linear-gradient(45deg, #fbc2eb 0%, #a6c1ee 100%); --grid-x: 2; --grid-y: 0;"></div>
    <div class="grid-item" style="background: linear-gradient(45deg, #fbc2eb 0%, #a6c1ee 100%); --grid-x: 0; --grid-y: 0;"></div>
</div>
</body>
</html>
