<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="paper" style="background-color: #9ec1a5">
    <div class="play-area paper">

        <!--Programming projects:           Workstations like the loom, well, oven, and windmill. ============================-->
        <!--School essays and projects:     Pages hung on the clothesline to dry, with envelopes and scrolls  ============================-->
        <!--Skills:                         The tomato plot and wheat field -->
        <!--Backstory:                      The campfire. Clicking it gives a short backstory in a box middle bottom of screen ============================-->
        <!--Personal info and hobbies:      Clicking a sheep gives a fun fact.-->
        <!--Resume and contact:             The envelope with the heart is a message form.-->


        <!--        Fences -->
        <div class="fence-bottom paper">
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
        </div>
        <div class="fence-right paper">
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
        </div>
        <div class="fence-top paper">
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
        </div>
        <div class="fence-left paper">
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
            <div class="fence-pole"></div>
        </div>

        <!-- Programming projects  -->
        <div class="object" id="programming-projects" style="top: 23vh;left: 15vw;z-index: 8;">
            <svg xmlns="http://www.w3.org/2000/svg" width="168" height="111" viewBox="0 0 112 74" stroke="#3a2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
                <filter id="blend-overlay-table" x="-1%" y="-1%" width="102%" height="102%">
                    <feImage href="paper_texture.jpg" result="texture" x="0" y="0" width="112" height="74" preserveAspectRatio="none"></feImage>
                    <feBlend mode="multiply" in="SourceGraphic" in2="texture" result="blended_result"></feBlend>
                    <feComposite operator="in" in="blended_result" in2="SourceGraphic"></feComposite>
                </filter>

                <g filter="url(#blend-overlay-table)" id="machine_table">
                    <rect x="12" y="46" width="10" height="26" rx="3" fill="#8a5f3c"></rect><rect x="90" y="46" width="10" height="26" rx="3" fill="#8a5f3c"></rect>
                    <rect x="2" y="2" width="108" height="48" rx="5" fill="#c9975f"></rect>
                    <rect x="10" y="10" width="56" height="32" rx="3" fill="#8ec5e8"></rect>
                    <rect x="72" y="8" width="32" height="36" rx="3" fill="#e3c08e"></rect>
                    <rect x="86" y="13" width="14" height="9" fill="#cfe9f7" stroke-width="2.5"></rect>
                    <circle cx="85" cy="33" r="4" fill="#8a5f3c" stroke-width="2.5"></circle>
                    <rect x="94" y="26" width="7" height="13" rx="2" fill="#f5c542" stroke-width="2.5"></rect></g>
            </svg>

            <p class="paper">Personal Projects</p>
        </div>

        <!-- SCHOOL PROJECTS -->
        <div class="object" id="school-projects" style="top: 54vh;left: 25vw;z-index: 10;">
            <svg xmlns="http://www.w3.org/2000/svg" width="182" height="123" viewBox="0 0 121 82" stroke="#3a2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
                <filter id="blend-overlay-clothesline" x="0" y="0" width="121" height="82" filterUnits="userSpaceOnUse">
                    <feImage href="paper_texture.jpg" x="0" y="0" width="121" height="82" preserveAspectRatio="none" result="texture"></feImage>
                    <feBlend mode="multiply" in="SourceGraphic" in2="texture" result="blended_result"></feBlend>
                    <feComposite operator="in" in="blended_result" in2="SourceGraphic"></feComposite>
                </filter>

                <g filter="url(#blend-overlay-clothesline)" id="clothesline">
                    <rect x="2" y="2" width="9" height="78" rx="3" fill="#c9975f"></rect>
                    <rect x="110" y="2" width="9" height="78" rx="3" fill="#c9975f"></rect>
                    <path d="M6 12 Q60.5 32 115 12" fill="none" stroke-width="3"></path>
                    <rect x="60" y="20" width="5" height="9" rx="1.5" fill="#f5c542" stroke-width="2"></rect>
                </g>
            </svg>

            <p class="paper">School Projects</p>
        </div>

        <!-- BACKSTORY -->
        <div class="object" id="backstory" style="top: 35vh;left: 45vw;z-index: 9;">
            <svg xmlns="http://www.w3.org/2000/svg" width="120" height="150" viewBox="24 16 80 92" stroke="#3a2b2b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
                <filter id="blend-overlay-campfire" x="0" y="0" width="104" height="113" filterUnits="userSpaceOnUse">
                    <feImage href="paper_texture.jpg" x="0" y="0" width="104" height="113" preserveAspectRatio="none" result="texture"></feImage>
                    <feBlend mode="multiply" in="SourceGraphic" in2="texture" result="blended_result"></feBlend>
                    <feComposite operator="in" in="blended_result" in2="SourceGraphic"></feComposite>
                </filter>

                <g filter="url(#blend-overlay-campfire)" id="campfire">
                    <path d="M64 14 C74 38 96 48 92 74 C90 96 38 96 36 74 C34 56 52 50 56 34 C58 26 60 22 64 14 Z" fill="#f7862d"></path>
                    <path d="M64 46 C70 58 80 62 78 76 C76 88 52 88 50 76 C48 66 58 62 60 54 Z" fill="#fcd24a" stroke-width="2.5"></path>
                    <rect x="24" y="88" width="80" height="12" rx="6" transform="rotate(-18 64 94)" fill="#8a5f3c"></rect>
                    <rect x="24" y="88" width="80" height="12" rx="6" transform="rotate(18 64 94)" fill="#a9784a"></rect>
                    <circle cx="98" cy="30" r="2.5" fill="#f7862d" stroke="none"></circle><circle cx="30" cy="40" r="2" fill="#f7862d" stroke="none"></circle></g>
            </svg>

            <p class="paper">Backstory</p>
        </div>
    </div>
</main>

<div class="ui-container">

    <!-- Day Box -->
    <div class="box paper" style="width: 430px;height: 85px;top: var(--padding);left: var(--padding);display: flex;flex-direction: column;">
        <h1 id="time-alive">DAY</h1>
    </div>


    <!-- Pause Box -->
    <div class="box paper" style="width: 85px;height: 85px;top: var(--padding);right: var(--padding);display: flex;flex-direction: column;">
        <div class="hamburger"></div>
        <div class="hamburger"></div>
        <div class="hamburger"></div>
    </div>

    <!-- Information Box -->
    <div class="box paper" style="width: 430px; bottom: var(--padding); left: var(--padding)">
        <h1>Information Box</h1>
        <p>Move your [Mouse] on anything to see its details here. Check these:</p>
        <ul>
            <li>Quests</li>
            <li>Items</li>
            <li>UI Frames</li>
        </ul>
    </div>

    <div class="box paper" id="backstory-box" style="opacity: 0; width: 500px; bottom: var(--padding); left: 50%; transform: translateX(-50%)">
        <p id="backstory-story-box">Move your [Mouse] on anything to see its details here. Check these:</p>
    </div>
</div>

</body>
<script src="index.js"></script>
</html>
