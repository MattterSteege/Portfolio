<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash-container">
    <svg class="outer_z" width="500" height="500">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="none" stroke="#222" stroke-width="1" font-size="50">MATT TER STEEGE</text>
    </svg>
    <svg class="inner_z" width="500" height="500">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#222" stroke="#222" stroke-width="1" font-size="50">MATT TER STEEGE</text>
    </svg>
</div>
<div class="overlay">
    <p class="help-text">Klik <kbd>R</kbd> om te centreren</p>
</div>
<div id="grid" style="--x: 0px; --y: 0px; --rotate: 0deg;">
<!--    <div class="grid-item square" style="background: red; &#45;&#45;grid-x: -0; &#45;&#45;grid-y: 0; z-index: 100;"></div>-->

    <!-- MATT NAME -->
    <!-- M -->
    <div class="grid-item letter-container" style="--grid-x: -3; --grid-y: 0;">
        <div class="letter tl"></div>
        <div class="letter c"></div>
        <div class="letter c"></div>
        <div class="letter c"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: -3; --grid-y: 1;">
        <div class="letter br"></div>
        <div class="letter br"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: -2; --grid-y: 0;">
        <div class="letter tr"></div>
        <div></div>
        <div class="letter c"></div>
        <div></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: -2; --grid-y: 1;">
        <div class="letter br"></div>
    </div>

    <!-- A -->
    <div class="grid-item letter-container" style="--grid-x: -1; --grid-y: -0.5;">
        <div class="letter tl"></div>
        <div class="letter c"></div>
        <div class="letter c"></div>
        <div></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: -1; --grid-y: 0.5;">
        <div class="letter bl"></div>
        <div class="letter c"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 0; --grid-y: -0.5;">
        <div class="letter tr"></div>
        <div></div>
        <div class="letter c"></div>
        <div></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 0; --grid-y: 0.5;">
        <div class="letter bl"></div>
    </div>

    <!-- T -->
    <div class="grid-item letter-container" style="--grid-x: 1; --grid-y: -0.5;">
        <div></div>
        <div></div>
        <div class="letter c"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 1; --grid-y: 0.5;">
        <div class="letter c"></div>
        <div class="letter c"></div>
        <div class="letter c"></div>
        <div></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 1; --grid-y: 1.5;">
        <div class="letter bl"></div>
        <div class="letter tr"></div>
    </div>

    <!-- T -->
    <div class="grid-item letter-container" style="--grid-x: 2; --grid-y: -1;">
        <div></div>
        <div></div>
        <div></div>
        <div class="letter c"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 2; --grid-y: 0;">
        <div></div>
        <div class="letter c"></div>
        <div></div>
        <div class="letter c"></div>
        <div></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 2; --grid-y: 1;">
        <div></div>
        <div class="letter bl"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 3; --grid-y: 0;">
        <div class="letter c"></div>
    </div>
    <div class="grid-item letter-container" style="--grid-x: 3; --grid-y: 1;">
        <div class="letter tr"></div>
    </div>

    <!-- wires -->
    <div class="grid-item" style="--grid-x: -1; --grid-y: 1.2; z-index: -1; width: calc(var(--cell-size) * 4); height: calc(var(--cell-size) * 15.65);">
        <svg width="400" height="800" viewBox="0 0 400 1600" id="mainSVG1">
            <defs>
                <!-- glow filter (reduced) -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="0.8" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <g id="wire1"></g>
        </svg>
    </div>

    <div class="grid-item" style="--grid-x: 2; --grid-y: 1.2; z-index: -1; width: calc(var(--cell-size) * 14); height: calc(var(--cell-size) * 6);">
        <svg width="1400" height="600" viewBox="0 0 1400 600" id="mainSVG2">
            <defs>
                <!-- glow filter (reduced) -->
                <filter id="glow">
                    <feGaussianBlur stdDeviation="0.8" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <g id="wire2"></g>
        </svg>
    </div>

    <!-- Contact -->
    <div class="grid-item area" style="--grid-x: 9; --grid-y: -2; width: calc(var(--cell-size) * 12.1); height: calc(var(--cell-size) * 14.1);">
        <div class="power-box" style="top: 68%;transform: translateY(-50%) rotateZ(-90deg);left: -30px;"></div>
    </div>

    <div class="grid-item title" style="--grid-x: 11.5; --grid-y: -2;">
        <span>CONTACT</span>
    </div>

    <div class="grid-item square" style="--grid-x: 10; --grid-y: 0; width: calc(var(--cell-size) * 4); height: calc(var(--cell-size) * 2);">
        <a class="image-text" href="https://github.com/matttersteege" target="_blank">
            <img src="images/GitHub_Invertocat_Black_Clearspace.svg" height="192" width="192"/>
            <span>Github</span>
        </a>
    </div>

    <div class="grid-item square" style="--grid-x: 12; --grid-y: 0; width: calc(var(--cell-size) * 4); height: calc(var(--cell-size) * 2);">
        <a class="image-text" href="mailto:matttersteege@gmail.com" target="_blank">
            <img src="images/email-icon.svg" height="192" width="192"/>
            <span>Email</span>
        </a>
    </div>

    <!-- Projects -->
    <div class="grid-item area" style="--grid-x: -6; --grid-y: 9; width: calc(var(--cell-size) * 24.1); height: calc(var(--cell-size) * 20.1);">
        <div class="power-box" style="left: 50%; translate: -50% 0; border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;"></div>
    </div>

    <div class="grid-item title" style="--grid-x: -0.5; --grid-y: 10;">
        <span>PROJECTEN</span>
    </div>

    <div class="grid-item square" style="--grid-x: -3; --grid-y: 12; width: calc(var(--cell-size) * 4); height: calc(var(--cell-size) * 2);">
        <a class="image-text" href="https://github.com/MattterSteege/Zermos-Archive" target="_blank">
            <img src="images/zermos_logo.png" height="192" width="192"/>
            <span>Zermos</span>
        </a>
    </div>

    <div class="grid-item square" style="--grid-x: 0; --grid-y: 12; width: calc(var(--cell-size) * 4); height: calc(var(--cell-size) * 2);">
        <a class="image-text" href="https://github.com/MattterSteege/Prism-Simulation" target="_blank">
            <span style="padding-left: 10px" >Prism Simulation</span>
        </a>
    </div>

</div>
</body>
<script src="index.js"></script>
<!-- wires are now created deferred from index.js (generateWiresDeferred) to avoid blocking initial render -->
</html>
