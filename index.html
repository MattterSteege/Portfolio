<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash-container">
    <!--suppress CssUnresolvedCustomProperty -->
    <style>
        #splash-container {
            --splash-duration: 2s;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns:1fr;
            grid-template-rows:30% 1fr 30%;
            grid-column-gap: 0;
            grid-row-gap: 0;
            position: fixed;
            z-index: 100000;
            background: white;
            animation: fade var(--splash-duration) forwards;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            --text-color: #1a1a1a;
            font-family: "Times New Roman", times, serif;
        }

        .outer_z, .inner_z {
            grid-area: 2 / 1 / 3 / 3;
            width: 100%;
            height: 100%
        }

        .outer_z text {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: draw var(--splash-duration) forwards
        }

        @keyframes draw {
            66.66% {
                stroke-dashoffset: 0
            }
        }

        @keyframes fade {
            0%, 75% {
                translate: 0% 0%
            }
            100% {
                translate: 0% -100%
            }
        }

        svg + .inner_z {
            animation: fadeIn;
            animation-duration: var(--splash-duration)
        }

        @keyframes fadeIn {
            0%, 53.33% {
                opacity: 0
            }
            66.66% {
                opacity: 1
            }
            100% {
                opacity: 1
            }
        }
    </style>
    <svg class="outer_z" width="500" height="500">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="none" stroke="var(--text-color)"
              stroke-width="1" font-size="100">MATT
        </text>
    </svg>
    <svg class="inner_z" width="500" height="500">
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="var(--text-color)"
              stroke="var(--text-color)" stroke-width="1" font-size="100">MATT
        </text>
    </svg>

</div>
<canvas id="scene" aria-label="Portfolio canvas" role="img"></canvas>
<div id="overlay">
    <p class="help-text">Klik <kbd>R</kbd> om te centreren</p>
</div>
</body>
<script src="index.js" type="module"></script>
</html>
